spring:
  application:
    name: own-settlement
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    config:
      fail-fast: true
      discovery:
        service-id: own-config
        enabled: true
      profile: ${spring.profiles.active}
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://own:change-me@localhost:8002/eureka}
