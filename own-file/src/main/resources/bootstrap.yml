spring:
  application:
    name: own-file
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    config:
      fail-fast: true
      discovery:
        service-id: own-config
        enabled: true
      profile: ${spring.profiles.active}
  #jpa:
   # hibernate:
    #  ddl-auto: create

own:
  file:
    storage:
      temporary-root: ${OWN_FILE_TEMP_ROOT:/opt/temp}
      permanent-root: ${OWN_FILE_PERMANENT_ROOT:/opt/real}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://own:change-me@localhost:8002/eureka}

---
spring:
  profiles: dev
eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 20
