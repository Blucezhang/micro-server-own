server:
  port: 6006

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/micro?useUnicode=true&characterEncoding=UTF-8&useSSL=false}
    username: ${MYSQL_USER:micro}
    password: ${MYSQL_PASSWORD:micro}
    driver-class-name: com.mysql.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
  data:
    neo4j:
      uri: ${NEO4J_URI:http://neo4j:7474}
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:change-me}

trade:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:}
    previous-service-token: ${INTERNAL_SERVICE_PREVIOUS_TOKEN:}
  idempotency:
    enabled: true
    retention-hours: 24
  security:
    login:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
      attempt-retention-days: ${LOGIN_ATTEMPT_RETENTION_DAYS:90}
      attempt-cleanup-delay-ms: ${LOGIN_ATTEMPT_CLEANUP_DELAY_MS:86400000}
    jwt:
      issuer: ${JWT_ISSUER:micro-server-own}
      secret: ${JWT_SECRET:}
      previous-secret: ${JWT_PREVIOUS_SECRET:}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
      refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:1209600}
      refresh-session-cleanup-delay-ms: ${JWT_REFRESH_SESSION_CLEANUP_DELAY_MS:3600000}
