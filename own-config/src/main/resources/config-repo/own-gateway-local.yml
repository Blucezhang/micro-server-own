server:
  port: 9632

trade:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:}
  security:
    jwt:
      # JWT is the default gateway authentication mode. Use a 32-byte-or-longer secret.
      enabled: ${JWT_ENABLED:true}
      issuer: ${JWT_ISSUER:micro-server-own}
      secret: ${JWT_SECRET:}
      previous-secret: ${JWT_PREVIOUS_SECRET:}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
      refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:1209600}

zuul:
  ignored-services: '*'
  ratelimit:
    enabled: true
    repository: IN_MEMORY
    # Keep false unless the gateway is reachable only through a trusted proxy
    # that overwrites forwarded-client headers.
    behind-proxy: ${GATEWAY_RATELIMIT_BEHIND_PROXY:false}
    default-policy:
      limit: 120
      quota: 1000
      refresh-interval: 60
      type:
        - ORIGIN
  routes:
    file:
      path: /file/**
      serviceId: own-file
      stripPrefix: false
    product:
      path: /product/**
      serviceId: own-product
      stripPrefix: false
    promotion:
      path: /sale/**
      serviceId: own-promotion
      stripPrefix: false
    send:
      path: /Info/**
      serviceId: own-send-server
      stripPrefix: false
    user:
      path: /user/**
      serviceId: own-user-party
      stripPrefix: true
    workflow:
      path: /flow/**
      serviceId: own-workflow
      stripPrefix: false
    inventory:
      path: /inventory/**
      serviceId: own-inventory
      stripPrefix: true
    order:
      path: /order/**
      serviceId: own-order
      stripPrefix: true
    settlement:
      path: /settlement/**
      serviceId: own-settlement
      stripPrefix: true
