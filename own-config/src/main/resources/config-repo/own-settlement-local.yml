server:
  port: 6011

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/micro?useUnicode=true&characterEncoding=UTF-8&useSSL=false}
    username: ${MYSQL_USER:micro}
    password: ${MYSQL_PASSWORD:micro}
    driver-class-name: com.mysql.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none

trade:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:}
    previous-service-token: ${INTERNAL_SERVICE_PREVIOUS_TOKEN:}
  idempotency:
    enabled: true
    retention-hours: 24
  settlement:
    merchant-rate: ${SETTLEMENT_MERCHANT_RATE:0.80}
    platform-rate: ${SETTLEMENT_PLATFORM_RATE:0.20}
    cycle-days: ${SETTLEMENT_CYCLE_DAYS:7}
    withdrawal-minimum: ${SETTLEMENT_WITHDRAWAL_MINIMUM:100.00}
    scan-fixed-delay-millis: ${SETTLEMENT_SCAN_FIXED_DELAY_MILLIS:86400000}
  payment:
    channel: ${PAYMENT_CHANNEL:MOCK_WECHAT}
    mock:
      callback-token: ${PAYMENT_MOCK_CALLBACK_TOKEN:}
    wechat:
      app-id: ${WECHAT_APP_ID:demo-wechat-app-id}
      merchant-id: ${WECHAT_MERCHANT_ID:demo-wechat-merchant-id}
      api-v3-key: ${WECHAT_API_V3_KEY:demo-only-replace-before-production}
    alipay:
      app-id: ${ALIPAY_APP_ID:demo-alipay-app-id}
      gateway: ${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
