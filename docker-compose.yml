services:
  mysql:
    image: mysql:5.7.44
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: micro
      MYSQL_USER: micro
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [backend]

  neo4j:
    image: neo4j:3.5.35-community
    platform: linux/amd64
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  nacos:
    image: nacos/nacos-server:v3.1.1
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLED:-false}
    ports: ["8848:8848"]
    networks: [backend, frontend]

  gateway:
    profiles: [app]
    build: {context: ., dockerfile: own-api-gateway/src/main/docker/Dockerfile}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      NACOS_SERVER_ADDR: nacos:8848
      JWT_ENABLED: ${JWT_ENABLED:-true}
      JWT_ISSUER: ${JWT_ISSUER:-micro-server-own}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
    ports: ["9632:9632"]
    depends_on: [nacos]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9632/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend, frontend]

  file:
    profiles: [app]
    build: {context: ., dockerfile: own-file/src/main/docker/Dockerfile}
    restart: unless-stopped
    environment: &mysql_env
      SPRING_PROFILES_ACTIVE: local
      NACOS_SERVER_ADDR: nacos:8848
      MYSQL_URL: jdbc:mysql://mysql:3306/micro?useUnicode=true&characterEncoding=UTF-8&useSSL=false
      MYSQL_USER: micro
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
    volumes: ["file-temp:/data/files/temp", "file-real:/data/files/real"]
    expose: ["6004"]
    depends_on: [mysql, nacos]
    networks: [backend]

  product:
    profiles: [app]
    build: {context: ., dockerfile: own-product/src/main/docker/Dockerfile}
    restart: unless-stopped
    environment:
      <<: *mysql_env
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    expose: ["6007"]
    depends_on: [mysql, neo4j, nacos]
    networks: [backend]

  promotion:
    profiles: [app]
    build: {context: ., dockerfile: own-promotion/src/main/docker/Dockerfile}
    restart: unless-stopped
    environment:
      <<: *mysql_env
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    expose: ["6005"]
    depends_on: [mysql, neo4j, nacos]
    networks: [backend]

  send:
    profiles: [app]
    build: {context: ., dockerfile: own-send-server/src/main/docker/Dockerfile}
    restart: unless-stopped
    environment: *mysql_env
    expose: ["6003"]
    depends_on: [mysql, nacos]
    networks: [backend]

  user:
    profiles: [app]
    build: {context: ., dockerfile: own-user-party/src/main/docker/Dockerfile}
    restart: unless-stopped
    environment:
      <<: *mysql_env
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      JWT_ISSUER: ${JWT_ISSUER:-micro-server-own}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    expose: ["6006"]
    depends_on: [mysql, neo4j, nacos]
    networks: [backend]

  workflow:
    profiles: [app]
    build: {context: ., dockerfile: own-workflow/src/main/docker/Dockerfile}
    restart: unless-stopped
    environment: *mysql_env
    expose: ["6008"]
    depends_on: [mysql, nacos]
    networks: [backend]

  inventory:
    profiles: [app]
    build: {context: ., dockerfile: own-inventory/src/main/docker/Dockerfile}
    restart: unless-stopped
    environment: *mysql_env
    expose: ["6009"]
    depends_on: [mysql, nacos]
    networks: [backend]

  order:
    profiles: [app]
    build: {context: ., dockerfile: own-order/src/main/docker/Dockerfile}
    restart: unless-stopped
    environment:
      <<: *mysql_env
      TRADE_OUTBOX_ROCKETMQ_ENABLED: ${TRADE_OUTBOX_ROCKETMQ_ENABLED:-false}
      ROCKETMQ_NAMESRV_ADDR: ${ROCKETMQ_NAMESRV_ADDR:-}
    expose: ["6010"]
    depends_on: [mysql, nacos, inventory, promotion]
    networks: [backend]

  settlement:
    profiles: [app]
    build: {context: ., dockerfile: own-settlement/src/main/docker/Dockerfile}
    restart: unless-stopped
    environment:
      <<: *mysql_env
      PAYMENT_CHANNEL: ${PAYMENT_CHANNEL:-MOCK_WECHAT}
      PAYMENT_MOCK_CALLBACK_TOKEN: ${PAYMENT_MOCK_CALLBACK_TOKEN:?set PAYMENT_MOCK_CALLBACK_TOKEN in .env}
    expose: ["6011"]
    depends_on: [mysql, nacos, order]
    networks: [backend]

networks:
  frontend:
  backend:

volumes:
  mysql-data:
  neo4j-data:
  file-temp:
  file-real:
