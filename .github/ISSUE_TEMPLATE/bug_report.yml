name: Bug report
description: Report a reproducible defect in the backend or Vben frontend.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve micro-server-own. Please remove passwords, tokens, personal data, and production URLs before submitting.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Backend service
        - Gateway or authentication
        - Vben frontend
        - Docker / Nacos configuration
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start ...
        2. Send / click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Include JDK, operating system, browser (if applicable), service version, and sanitized logs.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
