name: Java CI with Maven

on:
  push:
    branches: [master, jdk17]
  pull_request:
    branches: [master, jdk17]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify all Maven modules
        run: ./mvnw -B -ntp clean verify

      - name: Validate Compose configuration
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_PASSWORD: ci-mysql-password
          NEO4J_PASSWORD: ci-neo4j-password
          JWT_SECRET: ci-jwt-signing-key-at-least-32-bytes
          INTERNAL_SERVICE_TOKEN: ci-internal-service-token-at-least-32-bytes
          PAYMENT_MOCK_CALLBACK_TOKEN: ci-payment-callback-token-at-least-32-bytes
        run: docker compose config --quiet

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: micro-server-own-web-vben

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm
          cache-dependency-path: micro-server-own-web-vben/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Vben frontend
        run: pnpm --filter @vben/web-antd run typecheck

      - name: Test marketplace response contracts
        run: pnpm exec vitest run apps/web-antd/src/api/marketplace-models.test.ts

      - name: Build Vben frontend
        run: pnpm --filter @vben/web-antd run build
