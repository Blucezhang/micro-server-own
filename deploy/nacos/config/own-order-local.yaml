server:
  port: 6010

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/micro?useUnicode=true&characterEncoding=UTF-8&useSSL=false}
    username: ${MYSQL_USER:micro}
    password: ${MYSQL_PASSWORD:micro}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
  cloud:
    stream:
      rocketmq:
        binder:
          name-server: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
      bindings:
        orderEvents-out-0:
          destination: ${ROCKETMQ_ORDER_EVENT_TOPIC:trade.order.events}
          content-type: application/json

trade:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:}
    previous-service-token: ${INTERNAL_SERVICE_PREVIOUS_TOKEN:}
  idempotency:
    enabled: true
    retention-hours: 24
  order:
    payment-timeout-minutes: 15
    expiry-delay-millis: 60000
    auto-receipt-days: 7
    auto-receipt-delay-millis: 3600000
  saga:
    async-enabled: ${TRADE_SAGA_ASYNC_ENABLED:true}
    delay-millis: ${TRADE_SAGA_DELAY_MILLIS:1000}
    retry-seconds: ${TRADE_SAGA_RETRY_SECONDS:30}
    reservation-ttl-minutes: ${TRADE_INVENTORY_RESERVATION_TTL_MINUTES:15}
  outbox:
    webhook-url: ${ORDER_OUTBOX_WEBHOOK_URL:}
    webhook-secret: ${ORDER_OUTBOX_WEBHOOK_SECRET:}
    delay-millis: 60000
    retry-seconds: 60
    max-attempts: 10
    rocketmq:
      enabled: ${TRADE_OUTBOX_ROCKETMQ_ENABLED:false}
      binding: orderEvents-out-0
    after-sale:
      audit-reminder-hours: 48
      reminder-repeat-hours: 24
      reminder-delay-millis: 3600000
    security:
      audit-retention-days: 180
      audit-retention-delay-millis: 86400000
